<div id="app">
  <!-- Fil -->
  <section class="view view-feed active" id="view-feed">
    <header class="feed-top">
      <button class="icon-btn ghost" id="btn-topic-back" hidden aria-label="Retour"><svg><use href="#i-back"/></svg></button>
      <nav class="feed-tabs" id="feed-tabs">
        <button data-mode="actu">Actu</button>
        <button data-mode="pourtoi" class="on">Pour toi</button>
        <button data-mode="topic" id="tab-topic" hidden></button>
      </nav>
      <button class="icon-btn ghost" id="btn-search" aria-label="Rechercher"><svg><use href="#i-search"/></svg></button>
    </header>
    <div class="feeds" id="feeds"></div>
    <div class="nav-arrows">
      <button id="nav-up" aria-label="Article précédent"><svg><use href="#i-back"/></svg></button>
      <button id="nav-down" aria-label="Article suivant"><svg><use href="#i-back"/></svg></button>
    </div>
  </section>

  <!-- Explorer -->
  <section class="view view-page" id="view-explore">
    <div class="page">
      <div class="searchbar">
        <svg><use href="#i-search"/></svg>
        <input id="search-input" type="search" placeholder="Rechercher un sujet, une personne, un lieu..." autocomplete="off" enterkeyhint="search">
        <button class="icon-btn small" id="search-clear" hidden aria-label="Effacer"><svg><use href="#i-close"/></svg></button>
      </div>
      <div id="search-results" hidden></div>
      <div id="explore-home">
        <h2 class="h">Aujourd'hui</h2>
        <div class="hscroll" id="explore-today"><div class="skeleton tile"></div><div class="skeleton tile"></div><div class="skeleton tile"></div></div>
        <h2 class="h">Ce jour-là</h2>
        <div class="list" id="explore-onthisday"></div>
        <h2 class="h">Catégories</h2>
        <div class="cat-grid" id="explore-cats"></div>
        <h2 class="h">Affiner par sujet <span class="muted small">touche pour explorer, + pour suivre</span></h2>
        <div class="topic-grid" id="explore-topics"></div>
      </div>
    </div>
  </section>

  <!-- Bibliothèque -->
  <section class="view view-page" id="view-library">
    <div class="page">
      <h1 class="title">Bibliothèque</h1>
      <div class="seg" id="lib-seg">
        <button data-k="saved" class="on">Enregistrés</button>
        <button data-k="liked">Aimés</button>
        <button data-k="history">Historique</button>
      </div>
      <div class="list" id="lib-list"></div>
    </div>
  </section>

  <!-- Paramètres -->
  <section class="view view-page" id="view-settings">
    <div class="page" id="settings"></div>
  </section>

  <nav class="tabbar" id="tabbar">
    <button data-view="feed" class="on"><svg><use href="#i-home"/></svg><span>Fil</span></button>
    <button data-view="explore"><svg><use href="#i-compass"/></svg><span>Explorer</span></button>
    <button data-view="library"><svg><use href="#i-bookmark"/></svg><span>Biblio</span></button>
    <button data-view="settings"><svg><use href="#i-sliders"/></svg><span>Réglages</span></button>
  </nav>

  <!-- Lecteur plein article -->
  <div class="sheet" id="reader" hidden>
    <div class="sheet-bar">
      <button class="icon-btn" data-close aria-label="Fermer"><svg><use href="#i-close"/></svg></button>
      <span class="sheet-title" id="reader-title"></span>
      <a class="icon-btn" id="reader-wiki" target="_blank" rel="noopener" aria-label="Voir la source"><svg><use href="#i-external"/></svg></a>
    </div>
    <div class="sheet-body" id="reader-body"></div>
  </div>

  <!-- Accueil : concept, catégories, zone, profil -->
  <div class="onboarding" id="onboarding" hidden>
    <div class="ob-inner" id="ob-step"></div>
    <div class="ob-foot">
      <div class="ob-dots" id="ob-dots"></div>
      <button class="btn primary big" id="ob-go">Continuer</button>
    </div>
  </div>

  <div class="modal" id="modal" hidden><div class="modal-card" id="modal-card"></div></div>
  <div class="toast" id="toast" hidden></div>
</div>

<script src="js/topics.js?v=15"></script>
<script src="js/wiki.js?v=15"></script>
<script src="js/sources.js?v=15"></script>
<script src="js/sync.js?v=15"></script>
<script src="js/algo.js?v=15"></script>
<script src="js/app.js?v=15"></script>
</body>
</html>
